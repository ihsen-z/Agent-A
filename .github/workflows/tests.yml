name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer les dependances de test
        run: python -m pip install pytest pytest-timeout tzdata
      - name: Suite de tests
        # delai par test : un blocage sous Windows doit nommer le test fautif, pas geler le job
        run: python -m pytest tests -v --timeout=180 --durations=15 -p no:cacheprovider

  balayage:
    name: Balayage de graines (CA-01 et CA-02)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Zero manque rate sur des corpus varies
        run: python scripts/balayage_graines.py --nombre 40 --taux 0.18 0.40
