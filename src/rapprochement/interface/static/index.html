<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Relance des justificatifs</title>
  <meta name="description" content="Rapprochement bancaire et relance des pièces justificatives manquantes">
  <script>
    /* Theme choisi (clair / sombre), applique avant le premier rendu pour
       eviter tout flash. Sans choix enregistre : le theme du systeme. */
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <meta name="color-scheme" content="light dark">
  <link rel="preload" href="/static/polices/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/polices/ibm-plex-sans-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563EB'/%3E%3Cpath d='M10 8h8l4 4v12H10z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='m13 18 2.5 2.5L20 15' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="barre" aria-label="Navigation principale">
      <a class="marque" href="#accueil" aria-label="Accueil">
        <span class="marque-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M10 8h8l4 4v12H10z"/><path d="m13 18 2.5 2.5L20 15"/></svg>
        </span>
        <span class="marque-texte">
          <strong>Relance des justificatifs</strong>
          <small>Rapprochement bancaire</small>
        </span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="barre-pied">
        <div class="theme" id="theme" role="group" aria-label="Thème d'affichage">
          <button type="button" data-theme-choix="light" aria-pressed="false" title="Thème clair">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Clair
          </button>
          <button type="button" data-theme-choix="dark" aria-pressed="false" title="Thème sombre">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>Sombre
          </button>
          <button type="button" data-theme-choix="auto" aria-pressed="false" title="Suivre le réglage du système">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Auto
          </button>
        </div>
        <div id="source"></div>
        <p class="local">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          Traitement 100 % local : aucune donnée ne quitte ce poste.
        </p>
      </div>
    </aside>
    <main class="contenu" id="contenu" tabindex="-1">
      <div id="vue" class="vue"><p class="chargement">Chargement…</p></div>
    </main>
  </div>
  <div id="couche"></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
