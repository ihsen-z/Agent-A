[project]
name = "rapprochement-pieces"
version = "0.1.0"
description = "Rapprochement bancaire et relance des pieces justificatives manquantes"
requires-python = ">=3.11"
# tzdata : donnees de fuseaux horaires, necessaires seulement la ou le systeme n'en fournit pas.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
